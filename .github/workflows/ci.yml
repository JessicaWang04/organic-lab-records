name: Local toolkit checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - run: npm test
      - run: npm run test:python
      - run: npm run check-workbench-budget
      - run: npm run build-skill
      - run: python portable/organic-lab-records/scripts/replay_examples.py --output "${{ runner.temp }}/organic-lab-examples"
      - run: npm run package-skill
